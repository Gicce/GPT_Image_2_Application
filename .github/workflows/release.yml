name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 从 Tag 推导发布元数据：
      #   v4.0.0            → 正式 Release（prerelease=false）
      #   v4.0.0-test.1     → 测试正式版 V1（prerelease=true）
      #   v4.0.0-beta.1/rc.1 → Beta / RC（prerelease=true）
      - name: Derive release metadata from tag
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          CORE="${VER%%-*}"
          if [ "$CORE" = "$VER" ]; then
            PRERELEASE=false
            TITLE="CyImagePro V${CORE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}"
            STAGE="正式版"
          else
            PRERELEASE=true
            SUFFIX="${VER#*-}"
            CHANNEL_NAME="${SUFFIX%%.*}"
            ITER="${SUFFIX##*.}"
            case "$CHANNEL_NAME" in
              test) STAGE="测试正式版 V${ITER}" ;;
              beta) STAGE="Beta ${ITER}" ;;
              rc)   STAGE="RC ${ITER}" ;;
              *)    STAGE="${CHANNEL_NAME} ${ITER}" ;;
            esac
            TITLE="CyImagePro V${CORE} ${STAGE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}-${CHANNEL_NAME}-V${ITER}"
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<RELEASE_BODY_EOF"
            echo "# ${TITLE}"
            echo ""
            echo "这是 CyImagePro ${CORE} ${STAGE}（Tag：\`${TAG}\`）。"
            echo ""
            echo "## 本版本重点"
            echo ""
            echo "- CyImagePro 客户端版本升级至 ${CORE}"
            echo "- 设置与更新页面版本体系升级"
            echo "- 账户与用量相关功能持续完善"
            echo "- 图片生成与素材管理持续优化"
            echo "- AI 智能体及模型配置持续完善"
            echo "- Windows 客户端构建流程迁移至 GitHub Actions"
            echo ""
            echo "## 发布阶段"
            echo ""
            echo "${STAGE}"
            echo ""
            if [ "$PRERELEASE" = "true" ]; then
              echo "该版本用于功能验证和实际使用测试，仍可能存在尚未完善的功能。"
            fi
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: ${{ steps.meta.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
