name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 版本一致性守卫：Tag 版本必须与项目内四处版本字段完全一致
      # （package.json / tauri.conf.json / Cargo.toml / release.ts 心跳上报版本），
      # 不一致直接失败，禁止发布错误版本。
      - name: Verify version consistency
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "非 Tag 触发（${GITHUB_REF_NAME}），跳过版本一致性检查"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          REL=$(sed -n "s/.*version: '\([0-9][^']*\)'.*/\1/p" src/config/release.ts | head -1)
          echo "tag=${VER} package.json=${PKG} tauri.conf.json=${TAURI} Cargo.toml=${CARGO} release.ts=${REL}"
          if [ "$VER" != "$PKG" ] || [ "$VER" != "$TAURI" ] || [ "$VER" != "$CARGO" ] || [ "$VER" != "$REL" ]; then
            echo "::error::版本不一致：tag=${VER} package.json=${PKG} tauri.conf.json=${TAURI} Cargo.toml=${CARGO} release.ts=${REL}"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      # 从 Tag 推导发布元数据：
      #   v4.0.1            → 正式 Release（prerelease=false）
      #   v4.0.1-test.1     → 测试正式版 V1（prerelease=true）
      #   v4.0.1-beta.1/rc.1 → Beta / RC（prerelease=true）
      # Release Notes 正文从 CHANGELOG.md 对应小节提取（单一来源，禁止虚构内容）。
      - name: Derive release metadata from tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VER="${TAG#v}"
          CORE="${VER%%-*}"
          if [ "$CORE" = "$VER" ]; then
            PRERELEASE=false
            TITLE="CyImagePro V${CORE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}"
            STAGE="正式版"
          else
            PRERELEASE=true
            SUFFIX="${VER#*-}"
            CHANNEL_NAME="${SUFFIX%%.*}"
            ITER="${SUFFIX##*.}"
            case "$CHANNEL_NAME" in
              test) STAGE="测试正式版 V${ITER}" ;;
              beta) STAGE="Beta ${ITER}" ;;
              rc)   STAGE="RC ${ITER}" ;;
              *)    STAGE="${CHANNEL_NAME} ${ITER}" ;;
            esac
            TITLE="CyImagePro V${CORE} ${STAGE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}-${CHANNEL_NAME}-V${ITER}"
          fi
          if ! BODY=$(node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const re = new RegExp("^## v" + ver + "(?!\\d)");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex(l => re.test(l));
            if (start === -1) process.exit(1);
            const out = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].startsWith("## ")) break;
              out.push(lines[i]);
            }
            console.log(out.join("\n").trim());
          ' "$CORE"); then
            echo "::error::CHANGELOG.md 中未找到 v${CORE} 对应小节，拒绝生成虚构 Release Notes"
            exit 1
          fi
          if [ -z "$BODY" ]; then
            echo "::error::CHANGELOG.md 中 v${CORE} 小节内容为空"
            exit 1
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<RELEASE_BODY_EOF"
            echo "# ${TITLE}"
            echo ""
            echo "$BODY"
            echo ""
            echo "## 发布阶段"
            echo ""
            echo "${STAGE}"
            echo ""
            if [ "$PRERELEASE" = "true" ]; then
              echo "该版本用于功能验证和实际使用测试，仍可能存在尚未完善的功能。"
            fi
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # 正式打包前的完整检查：与 CI 保持同一套门禁。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.release_tag }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: ${{ steps.meta.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

      # Updater 产物自检：正式 Release 必须包含 latest.json，
      # 且 version 必须等于 tag 版本、windows-x86_64 必须带 url + signature。
      # 任何一项缺失 => 本次发布失败，禁止产出“检测不到更新”的假 Release。
      - name: Verify updater manifest on release
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          VER="${TAG#v}"
          sleep 10
          curl -sL --retry 5 --retry-delay 5 "https://github.com/Gicce/GPT_Image_2_Application/releases/download/${TAG}/latest.json" -o latest-check.json
          MANIFEST_VERSION=$(node -e '
            const fs = require("fs");
            let m;
            try { m = JSON.parse(fs.readFileSync("latest-check.json", "utf8")); } catch { console.error("latest.json 解析失败或不存在"); process.exit(2); }
            console.log(m.version || "");
          ' 2>manifest_err.txt) || { cat manifest_err.txt; echo "::error::Release 缺少 latest.json，updater 将无法发现新版本"; exit 1; }
          echo "latest.json version=${MANIFEST_VERSION} (expect ${VER})"
          node -e '
            const m = require("./latest-check.json");
            const errors = [];
            if (m.version !== process.argv[1]) errors.push(`version ${m.version} != tag ${process.argv[1]}`);
            const win = m.platforms && m.platforms["windows-x86_64"];
            if (!win) errors.push("缺少 windows-x86_64 平台条目");
            else {
              if (!win.url) errors.push("windows-x86_64 缺少 url");
              if (!win.signature) errors.push("windows-x86_64 缺少 signature");
            }
            if (errors.length) { errors.forEach(e => console.error("::error::" + e)); process.exit(1); }
            console.log("updater manifest OK: version=" + m.version + " url=" + win.url);
          ' "$VER"
