name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # 版本一致性守卫：Tag 版本必须与项目内四处版本字段完全一致
      # （package.json / tauri.conf.json / Cargo.toml / release.ts 心跳上报版本），
      # 不一致直接失败，禁止发布错误版本。
      - name: Verify version consistency
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "非 Tag 触发（${GITHUB_REF_NAME}），跳过版本一致性检查"
            exit 0
          fi
          VER="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          REL=$(sed -n "s/.*version: '\([0-9][^']*\)'.*/\1/p" src/config/release.ts | head -1)
          echo "tag=${VER} package.json=${PKG} tauri.conf.json=${TAURI} Cargo.toml=${CARGO} release.ts=${REL}"
          if [ "$VER" != "$PKG" ] || [ "$VER" != "$TAURI" ] || [ "$VER" != "$CARGO" ] || [ "$VER" != "$REL" ]; then
            echo "::error::版本不一致：tag=${VER} package.json=${PKG} tauri.conf.json=${TAURI} Cargo.toml=${CARGO} release.ts=${REL}"
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      # 从 Tag 推导发布元数据：
      #   v4.0.1            → 正式 Release（prerelease=false）
      #   v4.0.1-test.1     → 测试正式版 V1（prerelease=true）
      #   v4.0.1-beta.1/rc.1 → Beta / RC（prerelease=true）
      # Release Notes 正文从 CHANGELOG.md 对应小节提取（单一来源，禁止虚构内容）。
      - name: Derive release metadata from tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VER="${TAG#v}"
          CORE="${VER%%-*}"
          if [ "$CORE" = "$VER" ]; then
            PRERELEASE=false
            TITLE="CyImagePro V${CORE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}"
            STAGE="正式版"
          else
            PRERELEASE=true
            SUFFIX="${VER#*-}"
            CHANNEL_NAME="${SUFFIX%%.*}"
            ITER="${SUFFIX##*.}"
            case "$CHANNEL_NAME" in
              test) STAGE="测试正式版 V${ITER}" ;;
              beta) STAGE="Beta ${ITER}" ;;
              rc)   STAGE="RC ${ITER}" ;;
              *)    STAGE="${CHANNEL_NAME} ${ITER}" ;;
            esac
            TITLE="CyImagePro V${CORE} ${STAGE}"
            ARTIFACT="CyImagePro-Windows-V${CORE}-${CHANNEL_NAME}-V${ITER}"
          fi
          if ! BODY=$(node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const re = new RegExp("^## v" + ver + "(?!\\d)");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex(l => re.test(l));
            if (start === -1) process.exit(1);
            const out = [];
            for (let i = start + 1; i < lines.length; i++) {
              if (lines[i].startsWith("## ")) break;
              out.push(lines[i]);
            }
            console.log(out.join("\n").trim());
          ' "$CORE"); then
            echo "::error::CHANGELOG.md 中未找到 v${CORE} 对应小节，拒绝生成虚构 Release Notes"
            exit 1
          fi
          if [ -z "$BODY" ]; then
            echo "::error::CHANGELOG.md 中 v${CORE} 小节内容为空"
            exit 1
          fi
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TITLE}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<RELEASE_BODY_EOF"
            echo "# ${TITLE}"
            echo ""
            echo "$BODY"
            echo ""
            echo "## 发布阶段"
            echo ""
            echo "${STAGE}"
            echo ""
            if [ "$PRERELEASE" = "true" ]; then
              echo "该版本用于功能验证和实际使用测试，仍可能存在尚未完善的功能。"
            fi
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # 正式打包前的完整检查：与 CI 保持同一套门禁。
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.release_tag }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: ${{ steps.meta.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: warn

      # ===== 官方镜像分发音（与 GitHub Release 同一次构建、同一签名，byte-for-byte）=====
      # 策略：GitHub Release 与官方服务器 www.zjcypc.com 两处 manifest 内容恒相同，
      # 所有 installer url 一律指向官方镜像；GitHub 仅作为元数据备用通道与人工下载渠道。

      - name: Collect bundle files and hashes
        id: bundles
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          VER="${TAG#v}"
          NSIS_EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          MSI_BIN=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          for f in "$NSIS_EXE" "$NSIS_EXE.sig" "$MSI_BIN" "$MSI_BIN.sig"; do
            [ -f "$f" ] || { echo "::error::缺少构建产物 $f"; exit 1; }
          done
          NSIS_SHA=$(sha256sum "$NSIS_EXE" | cut -d' ' -f1)
          MSI_SHA=$(sha256sum "$MSI_BIN" | cut -d' ' -f1)
          echo "nsis_exe=$NSIS_EXE" >> "$GITHUB_OUTPUT"
          echo "nsis_sig=$NSIS_EXE.sig" >> "$GITHUB_OUTPUT"
          echo "msi_bin=$MSI_BIN" >> "$GITHUB_OUTPUT"
          echo "msi_sig=$MSI_BIN.sig" >> "$GITHUB_OUTPUT"
          echo "nsis_sha=$NSIS_SHA" >> "$GITHUB_OUTPUT"
          echo "msi_sha=$MSI_SHA" >> "$GITHUB_OUTPUT"
          echo "构建产物 SHA256: nsis=$NSIS_SHA msi=$MSI_SHA"

      - name: Generate official manifest from release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          VER="${TAG#v}"
          sleep 10
          curl -sL --retry 5 --retry-delay 5 "https://github.com/Gicce/GPT_Image_2_Application/releases/download/${TAG}/latest.json" -o github-latest.json
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            let m;
            try { m = JSON.parse(fs.readFileSync("github-latest.json", "utf8")); }
            catch { console.error("::error::Release 缺少 tauri-action 生成的 latest.json"); process.exit(1); }
            const base = `https://www.zjcypc.com/client-updates/v${ver}/`;
            for (const e of Object.values(m.platforms || {})) {
              e.url = base + e.url.split("/").pop() + `?v=${ver}`;
            }
            fs.writeFileSync("official-latest.json", JSON.stringify(m, null, 2) + "\n");
            console.log("official manifest generated (version=" + m.version + ")");
          ' "$VER"

      # 用官方 manifest 覆盖 Release 上的 latest.json 资产（version/signature/pub_date 不变，仅 url 指向官方镜像）。
      # 注意：gh api 对 uploads.github.com 的 POST 路由返回 404（v4.0.4 实测），资产上传必须用 curl 直连。
      - name: Replace release latest.json asset with official manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          RELEASE_ID=$(curl -sf -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/Gicce/GPT_Image_2_Application/releases/tags/${TAG}" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).id")
          ASSET_ID=$(curl -sf -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/Gicce/GPT_Image_2_Application/releases/${RELEASE_ID}/assets" | node -e "const a = JSON.parse(require('fs').readFileSync(0,'utf8')).find(x => x.name === 'latest.json'); if (a) console.log(a.id)")
          if [ -n "$ASSET_ID" ]; then
            curl -sf -X DELETE -H "Authorization: token ${GH_TOKEN}" "https://api.github.com/repos/Gicce/GPT_Image_2_Application/releases/assets/${ASSET_ID}"
            echo "旧 latest.json 资产已删除 (asset ${ASSET_ID})"
          fi
          curl -sf -X POST -H "Authorization: token ${GH_TOKEN}" -H "Content-Type: application/octet-stream" \
            --data-binary @official-latest.json \
            "https://uploads.github.com/repos/Gicce/GPT_Image_2_Application/releases/${RELEASE_ID}/assets?name=latest.json" -o /dev/null
          echo "official latest.json 资产已上传到 Release ${TAG}"

      - name: Upload artifacts to official mirror
        shell: bash
        env:
          MIRROR_KEY: ${{ secrets.OFFICIAL_MIRROR_SSH_KEY }}
          MIRROR_HOST: ${{ secrets.OFFICIAL_MIRROR_HOST }}
          MIRROR_USER: ${{ secrets.OFFICIAL_MIRROR_USER }}
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          VER="${TAG#v}"
          set -euo pipefail
          KEY_FILE=$(mktemp)
          printf '%s\n' "$MIRROR_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          STAGE="/tmp/cyimagepro-release-${VER}-$$"
          ssh $SSH_OPTS "${MIRROR_USER}@${MIRROR_HOST}" "mkdir -p '${STAGE}/v${VER}'"
          scp $SSH_OPTS \
            "${{ steps.bundles.outputs.nsis_exe }}" \
            "${{ steps.bundles.outputs.nsis_sig }}" \
            "${{ steps.bundles.outputs.msi_bin }}" \
            "${{ steps.bundles.outputs.msi_sig }}" \
            "${MIRROR_USER}@${MIRROR_HOST}:${STAGE}/v${VER}/"
          scp $SSH_OPTS official-latest.json "${MIRROR_USER}@${MIRROR_HOST}:${STAGE}/latest.json"
          ssh $SSH_OPTS "${MIRROR_USER}@${MIRROR_HOST}" "set -euo pipefail; \
            DEST=/opt/GPT_Image_2_service/client-updates; \
            if [ -e \"\$DEST/v${VER}\" ]; then echo '::error::官方镜像已存在 v${VER}，禁止覆盖已发布产物'; exit 1; fi; \
            mv '${STAGE}/v${VER}' \"\$DEST/v${VER}\" && \
            mv '${STAGE}/latest.json' \"\$DEST/latest.json\" && \
            rmdir '${STAGE}' && \
            sha256sum \"\$DEST/v${VER}\"/* \"\$DEST/latest.json\""
          rm -f "$KEY_FILE"

      # Updater 产物自检：Release 与官方镜像的 manifest 必须一致，
      # version 必须等于 tag 版本，三个 windows 平台键必须带 url + signature，
      # 且所有 url host 必须是官方镜像（Official Manifest Guard：禁止 github.com）。
      # 任何一项缺失 => 本次发布失败，禁止产出“检测不到更新”或“下载走 GitHub”的假 Release。
      - name: Verify updater manifest on release
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.release_tag }}"
          VER="${TAG#v}"
          sleep 5
          curl -sL --retry 5 --retry-delay 5 "https://github.com/Gicce/GPT_Image_2_Application/releases/download/${TAG}/latest.json" -o latest-check.json
          curl -sL --retry 5 --retry-delay 5 "https://www.zjcypc.com/client-updates/latest.json" -o official-check.json
          node -e '
            const fs = require("fs");
            let m, o;
            try { m = JSON.parse(fs.readFileSync("latest-check.json", "utf8")); }
            catch { console.error("::error::Release 缺少 latest.json，updater 将无法发现新版本"); process.exit(1); }
            try { o = JSON.parse(fs.readFileSync("official-check.json", "utf8")); }
            catch { console.error("::error::官方镜像 latest.json 不可用"); process.exit(1); }
            const errors = [];
            if (m.version !== process.argv[1]) errors.push(`version ${m.version} != tag ${process.argv[1]}`);
            for (const key of ["windows-x86_64", "windows-x86_64-msi", "windows-x86_64-nsis"]) {
              const e = m.platforms && m.platforms[key];
              if (!e) { errors.push(`缺少 ${key} 平台条目`); continue; }
              if (!e.url) errors.push(`${key} 缺少 url`);
              if (!e.signature) errors.push(`${key} 缺少 signature`);
            }
            const hosts = [...new Set(Object.values(m.platforms || {}).map(e => new URL(e.url).host))];
            if (hosts.some(h => h !== "www.zjcypc.com")) errors.push(`manifest url host 非官方镜像: ${hosts.join(",")}`);
            if (JSON.stringify(m) !== JSON.stringify(o)) errors.push("GitHub manifest 与官方 manifest 内容不一致");
            if (errors.length) { errors.forEach(e => console.error("::error::" + e)); process.exit(1); }
            console.log("updater manifest OK（GitHub + Official 一致）: version=" + m.version + " hosts=" + hosts.join(","));
          ' "$VER"

      # 公网下载冒烟 + 签名实测：从官方镜像真实下载全部平台安装包，
      # SHA256 与本地构建产物比对（byte-for-byte），并用客户端内置公钥做 minisign 验签。
      - name: Verify official mirror download and signatures
        shell: bash
        run: |
          VER="${{ steps.meta.outputs.release_tag }}"
          VER="${VER#v}"
          PUBKEY=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          EXPECT="windows-x86_64-nsis=${{ steps.bundles.outputs.nsis_sha }},windows-x86_64-msi=${{ steps.bundles.outputs.msi_sha }},windows-x86_64=${{ steps.bundles.outputs.msi_sha }}"
          node scripts/verify-updater-artifacts.mjs \
            --manifest "https://www.zjcypc.com/client-updates/latest.json" \
            --pubkey "$PUBKEY" \
            --expect-version "$VER" \
            --allow-host "www.zjcypc.com" \
            --expect-sha256 "$EXPECT"
