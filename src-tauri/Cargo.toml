[package]
name = "gpt-image-batch-generator"
version = "4.3.0"
edition = "2021"

[lib]
name = "gpt_image_batch_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
opener = "0.7"
once_cell = "1"
image = "0.25"
md5 = "0.7"
dirs = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

# V4.2.11 E2E：最终页组合器（jsdom 无 canvas 2D，组合由 Rust 等价实现承担，
# 几何常量与 src/features/comic/comicExport.ts computePageLayouts 同源）
[dev-dependencies]
imageproc = "0.25"
ab_glyph = "0.2"
